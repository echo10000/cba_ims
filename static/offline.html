<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - CBA IMS</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f8f9fa;
            color: #333;
            text-align: center;
            padding: 2rem;
        }
        .offline-container { max-width: 400px; }
        .offline-icon { font-size: 4rem; margin-bottom: 1rem; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #6c757d; margin-bottom: 1.5rem; }
        button {
            background: #0d6efd; color: #fff; border: none;
            padding: 0.75rem 2rem; border-radius: 0.5rem;
            font-size: 1rem; cursor: pointer;
        }
        button:hover { background: #0b5ed7; }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>You're Offline</h1>
        <p>CBA IMS requires an internet connection to access inventory data. Please check your connection and try again.</p>
        <button onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
